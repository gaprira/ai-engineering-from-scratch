services:
  # Твой AI Dev Container
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./:/workspace       # Монтируем текущую папку
      - ./models:/models    # Папка для моделей (создастся автоматически)
    ports:
      - "8888:8888"         # Пробрасываем порт для Jupyter
    stdin_open: true
    tty: true
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  # Векторная база данных Qdrant (для будущего RAG)
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"         # HTTP API
      - "6334:6334"         # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:              # Именованный том для данных Qdrant